    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FBFBF9" />
    <script>
      /* set the theme before first paint: light unless the visitor chose dark */
      (function () {
        var t;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'dark') t = 'light';
        document.documentElement.dataset.theme = t;
        document.querySelector('meta[name="theme-color"]').content = t === 'dark' ? '#0B0B0B' : '#FBFBF9';
      })();
    </script>
    <title>Mayank Singh Kashyap — Developer</title>
    <meta name="description" content="Mayank Singh Kashyap — third-year CS student and full-stack developer. Built Verdikt, WiseRoom, ResolverHub, Shrink-This and Bookipedia with React, Node.js, MongoDB and PostgreSQL. One block at a time." />
